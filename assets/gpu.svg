    }
    svg {
        color: #000;  /* set value of 'currentColor' */
    }
    @media (prefers-color-scheme: dark) {
        svg {
            color: #FFF;  /* set value of 'currentColor' */
        }
    }
    svg {
        fill: currentColor;
        stroke: currentColor;
    }
  </style>

